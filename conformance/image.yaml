{
  "name": "image",
  "steps": [
    {
      "call": "session/new",
      "params": {
        "cwd": "{{workspace}}",
        "mcpServers": []
      },
      "save": {
        "session": "$.sessionId"
      }
    },
    {
      "call": "session/prompt",
      "params": {
        "sessionId": "{{session}}",
        "prompt": [
          {
            "type": "text",
            "text": "expect-image"
          },
          {
            "type": "image",
            "mimeType": "image/png",
            "data": "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGNgYGAAAAAEAAH2FzhVAAAAAElFTkSuQmCC"
          }
        ]
      },
      "expect": {
        "stopReason": "end_turn"
      }
    }
  ]
}

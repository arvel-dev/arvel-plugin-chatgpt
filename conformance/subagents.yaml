{
  "name": "subagents",
  "steps": [
    {
      "call": "session/new",
      "params": {
        "cwd": "{{workspace}}",
        "mcpServers": [],
        "_meta": {
          "arvel": {
            "subagents": {
              "enabled": true,
              "maxParallel": 2
            }
          }
        }
      },
      "save": {
        "session": "$.sessionId"
      }
    },
    {
      "call": "session/prompt",
      "params": {
        "sessionId": "{{session}}",
        "prompt": [
          {
            "type": "text",
            "text": "child-agent"
          }
        ]
      },
      "expect": {
        "stopReason": "end_turn"
      },
      "expectUpdates": [
        {
          "sessionUpdate": "agent_message_chunk",
          "subset": {
            "content": {
              "text": "early child output"
            }
          }
        }
      ]
    }
  ]
}

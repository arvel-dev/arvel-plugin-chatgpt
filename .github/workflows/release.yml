# SPDX-License-Identifier: MIT-0
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  release:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the plugin without CGO
        run: go build -o bin/arvel-plugin-chatgpt ./cmd/arvel-plugin-chatgpt
        env:
          CGO_ENABLED: '0'
      - name: Install the pinned checker
        run: go install github.com/arvel-dev/arvel-sdk/cmd/arvel-plugin-check@v0.1.3
      - name: Release conformance
        run: arvel-plugin-check --level release --manifest arvel.json --scenarios conformance -- ./bin/arvel-plugin-chatgpt
      - name: Extract required release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: sh scripts/release-notes.sh "${RELEASE_TAG#v}" > "$RUNNER_TEMP/release-notes.md"
      - name: Build archives and create a draft
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.19.0
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

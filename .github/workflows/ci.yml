# SPDX-License-Identifier: MIT-0
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go test -race ./...
        env:
          CGO_ENABLED: '1'
      - run: go build -o bin/arvel-plugin-chatgpt.exe ./cmd/arvel-plugin-chatgpt
        env:
          CGO_ENABLED: '0'
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: '22'
      - name: Record native Windows sandbox readiness
        if: runner.os == 'Windows'
        run: |
          npm install --prefix "$RUNNER_TEMP/arvel-codex" --ignore-scripts --no-audit --no-fund @openai/codex@0.164.0
          go run ./cmd/record-fixtures record --scenario windows-readiness --home private --codex "$RUNNER_TEMP/arvel-codex/node_modules/.bin/codex.cmd" --schema testdata/schema/0.164.0 --out "$RUNNER_TEMP/windows-readiness" --timeout 45s
        env:
          ARVEL_E2E: '1'
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-readiness
          path: ${{ runner.temp }}/windows-readiness
          if-no-files-found: warn

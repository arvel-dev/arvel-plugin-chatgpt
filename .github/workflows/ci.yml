# SPDX-License-Identifier: MIT-0
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go test -race ./...
        env:
          CGO_ENABLED: '1'
      - run: go build -o bin/arvel-plugin-chatgpt.exe ./cmd/arvel-plugin-chatgpt
        env:
          CGO_ENABLED: '0'
      # Bootstrap protocol and manifest checks are covered by the offline tests.
      # Enable the basic checker once model discovery is implemented.
